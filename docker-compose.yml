services:
  db:
    image: postgis/postgis:16-3.4
    container_name: milkman-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-milkman}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-milkman_dev}
      POSTGRES_DB: ${DATABASE_NAME:-milkman}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-milkman} -d ${DATABASE_NAME:-milkman}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: milkman-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  redisdata:
